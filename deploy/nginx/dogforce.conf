# DeployGuard Nginx Configuration
# Production (8069) + Staging (8070) Reverse Proxy

# Production HTTP -> HTTPS Redirect
server {
    listen 80;
    server_name dogforcesecurityservices.com www.dogforcesecurityservices.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Production HTTPS (dogforcesecurityservices.com)
server {
    listen 443 ssl http2;
    server_name dogforcesecurityservices.com www.dogforcesecurityservices.com;

    ssl_certificate /etc/letsencrypt/live/dogforcesecurityservices.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dogforcesecurityservices.com/privkey.pem;

    proxy_read_timeout 720s;
    proxy_connect_timeout 720s;
    proxy_send_timeout 720s;

    # Gzip Compression
    gzip on;
    gzip_types text/css text/less text/plain text/xml application/xml application/json application/javascript;

    # Odoo Web Requests -> Production (Port 8069)
    location / {
        proxy_pass http://127.0.0.1:8069;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Odoo Longpolling / WebSockets -> Production (Port 8072)
    location /websocket {
        proxy_pass http://127.0.0.1:8072;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# Staging Environment (staging.dogforcesecurityservices.com or Port 8070)
server {
    listen 80;
    listen 8070;
    server_name staging.dogforcesecurityservices.com;

    proxy_read_timeout 720s;
    proxy_connect_timeout 720s;
    proxy_send_timeout 720s;

    # Odoo Web Requests -> Staging (Port 8070)
    location / {
        proxy_pass http://127.0.0.1:8070;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
