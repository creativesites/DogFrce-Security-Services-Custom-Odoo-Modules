<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Aura Glow -->
  <path d="M 100 20 C 145 20 170 35 170 85 C 170 145 125 175 100 185 C 75 175 30 145 30 85 C 30 35 55 20 100 20 Z" fill="#2563eb" opacity="0.25" filter="url(#glow)"/>
  
  <!-- Main Shield Body -->
  <path d="M 100 25 C 140 25 165 38 165 85 C 165 140 122 168 100 178 C 78 168 35 140 35 85 C 35 38 60 25 100 25 Z" fill="url(#shieldGradient)" stroke="#60a5fa" stroke-width="3"/>
  
  <!-- Golden Chevron Badge -->
  <path d="M 100 45 L 140 70 L 100 95 L 60 70 Z" fill="url(#accentGradient)" opacity="0.9"/>
  
  <!-- Friendly Mascot Eyes -->
  <circle cx="82" cy="105" r="9" fill="#ffffff"/>
  <circle cx="84" cy="105" r="4" fill="#0f172a"/>
  <circle cx="86" cy="103" r="1.5" fill="#ffffff"/>
  
  <circle cx="118" cy="105" r="9" fill="#ffffff"/>
  <circle cx="116" cy="105" r="4" fill="#0f172a"/>
  <circle cx="114" cy="103" r="1.5" fill="#ffffff"/>
  
  <!-- Wink/Smile Line -->
  <path d="M 86 128 Q 100 142 114 128" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Star Sparkle -->
  <polygon points="100,150 102,156 108,158 102,160 100,166 98,160 92,158 98,156" fill="#fbbf24"/>
</svg>
